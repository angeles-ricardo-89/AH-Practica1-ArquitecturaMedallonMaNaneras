services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mananeras-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mananeras
      POSTGRES_USER: mananeras
      POSTGRES_PASSWORD: mananeras
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mananeras -d mananeras"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse-net

  backend:
    build: ./backend
    container_name: mananeras-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLAMACPP_BASE_URL: http://host.docker.internal:9200/v1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lakehouse-net

  frontend:
    build: ./frontend
    container_name: mananeras-frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - lakehouse-net

  # Verificacion del pipeline medallon con muestra Bronze congelada (no toca el corpus real).
  # Ollama/llamacpp corren en el host: se alcanzan via host.docker.internal.
  pipeline:
    build:
      context: ./backend
      dockerfile: Dockerfile.pipeline
    profiles: ["pipeline"]
    container_name: mananeras-pipeline
    env_file:
      - .env
    environment:
      APP_ENV: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mananeras_verify
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLAMACPP_BASE_URL: http://host.docker.internal:9200/v1
      DUCKLAKE_DATA_PATH: /data/verify/ducklake_verify.duckdb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lakehouse-net

networks:
  lakehouse-net:
    driver: bridge

volumes:
  pgdata:
