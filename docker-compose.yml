services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mananeras-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mananeras
      POSTGRES_USER: mananeras
      POSTGRES_PASSWORD: mananeras
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mananeras -d mananeras"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: mananeras-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3

  llamacpp:
    image: ghcr.io/ggerganov/llama.cpp:full-1e5a6d088d0f3a967c6e86298a756daec9e8df12
    container_name: mananeras-llamacpp
    restart: unless-stopped
    ports:
      - "9201:9200"
    volumes:
      - llamacpp_models:/models
    command:
      - "--server"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9200"
      - "--model"
      - "/models/gemma4.gguf"
      - "--ctx-size"
      - "8192"
      - "--n-gpu-layers"
      - "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/v1/models | grep -q gemma4 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

volumes:
  pgdata:
  ollama_data:
  llamacpp_models:
